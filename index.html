<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema EOQ - Registro de Inventarios</title>
  <style>
    :root { --primary: #1B365D; --secondary: #117A65; --bg: #f4f7f6; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
    .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
    h2 { color: var(--primary); margin-top: 0; text-align: center; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .full-width { grid-column: span 2; }
    label { font-weight: 600; font-size: 13px; color: #444; display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    input:focus { border-color: var(--secondary); outline: none; }
    .section-title { font-weight: bold; color: var(--primary); margin-top: 15px; margin-bottom: 5px; grid-column: span 2; font-size: 14px; border-left: 4px solid var(--secondary); padding-left: 8px; }
    button { grid-column: span 2; background: var(--secondary); color: white; border: none; padding: 14px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; transition: background 0.2s; }
    button:hover { background: #0e6251; }
    #msg { grid-column: span 2; text-align: center; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Control de Inventario EOQ / ROP</h2>
  <form id="eoqForm" class="grid">
    
    <div class="section-title">1. Información del Producto</div>
    <div><label>SKU / Código:</label><input type="text" id="sku" required placeholder="Ej: JOY-001"></div>
    <div><label>Categoría:</label><input type="text" id="categoria" placeholder="Ej: Anillos"></div>
    <div class="full-width"><label>Descripción del Producto:</label><input type="text" id="descripcion" required placeholder="Ej: Collar de Plata 925"></div>

    <div class="section-title">2. Demanda y Proveedor</div>
    <div><label>Precio Unitario (P) [S/]:</label><input type="number" step="0.01" id="precio" required placeholder="50.90"></div>
    <div><label>Demanda Anual (D) [Unidades]:</label><input type="number" id="demanda" required placeholder="1500"></div>
    <div class="full-width"><label>Plazo Entrega Proveedor (L) [Días]:</label><input type="number" id="plazo" required placeholder="15"></div>

    <div class="section-title">3. Parámetros de Costes</div>
    <div><label>Coste Pedido (k) [S/ orden]:</label><input type="number" step="0.01" id="k" required placeholder="29.69"></div>
    <div><label>Coste Fijo Almacén (a) [S/ unid/año]:</label><input type="number" step="0.01" id="a" required placeholder="5.00"></div>
    <div><label>Tasa Oportunidad (i) [% anual]:</label><input type="number" step="0.1" id="i" required placeholder="10"></div>
    <div><label>Stock Seguridad (Ss) [Unid]:</label><input type="number" id="ss" required placeholder="20"></div>

    <div class="section-title">4. Estado Actual</div>
    <div class="full-width"><label>Stock Actual en Almacén [Unidades]:</label><input type="number" id="stockActual" required placeholder="45"></div>

    <button type="submit" id="btnSubmit">Guardar en Google Sheets</button>
    <div id="msg"></div>
  </form>
</div>

<script>
  // INSERTA AQUÍ LA URL GENERADA POR GOOGLE APPS SCRIPT
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyGL3psK5YxgPnEXLs04dZROD9h8D1N_gWSXs_i-_J8GdfZfd28q5ZIDP1rnTRPafc9/exec";

  document.getElementById('eoqForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    const msg = document.getElementById('msg');
    
    btn.disabled = true;
    msg.style.color = '#333';
    msg.innerText = "Enviando datos a Google Sheets...";

    const payload = {
      sku: document.getElementById('sku').value,
      descripcion: document.getElementById('descripcion').value,
      categoria: document.getElementById('categoria').value,
      precio: document.getElementById('precio').value,
      demanda: document.getElementById('demanda').value,
      plazo: document.getElementById('plazo').value,
      k: document.getElementById('k').value,
      a: document.getElementById('a').value,
      i: document.getElementById('i').value,
      ss: document.getElementById('ss').value,
      stockActual: document.getElementById('stockActual').value
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      msg.style.color = 'green';
      msg.innerText = "¡Producto y fórmulas registradas con éxito!";
      document.getElementById('eoqForm').reset();
      btn.disabled = false;
    })
    .catch(err => {
      msg.style.color = 'red';
      msg.innerText = "Error al guardar el registro.";
      console.error(err);
      btn.disabled = false;
    });
  });
</script>

</body>
</html>
